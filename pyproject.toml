[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "botslab360"
version = "0.6.0"
description = "Async Python client for Botslab/360 robot vacuums"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "ATTRIBUTION.md"]

dependencies = [
    "cryptography>=42",
    "httpx>=0.27,<1",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.urls]
Source = "https://github.com/placix/python-botslab360"
Issues = "https://github.com/placix/python-botslab360/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Self would require typing_extensions on supported Python 3.10 installations.
ignore = ["PYI034"]
