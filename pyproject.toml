[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botslab360"
version = "0.1.0"
description = "Async authentication client for Botslab/360 smart-home devices"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
